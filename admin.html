<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIACARE HR SYSTEM - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0E4D2B 0%, #1565C0 100%);
      color: #333;
      overflow-x: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100vh;
      background: linear-gradient(180deg, #0E4D2B 0%, #1565C0 100%);
      color: white;
      padding: 30px 24px;
      box-shadow: 4px 0 24px rgba(0,0,0,0.15);
      z-index: 1000;
      transition: transform 0.3s ease;
    }

    .sidebar-logo {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-logo h2 {
      font-size: 28px;
      font-weight: 700;
      margin: 8px 0;
      background: linear-gradient(135deg, #fff, #e8f5e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar-logo p {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 500;
    }

    .sidebar-nav {
      list-style: none;
    }

    .sidebar-nav li {
      margin-bottom: 12px;
    }

    .sidebar-nav button {
      width: 100%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: none;
      color: white;
      padding: 16px 20px;
      border-radius: 16px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-nav button:hover,
    .sidebar-nav button.active {
      background: rgba(255,255,255,0.2);
      transform: translateX(8px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    /* MAIN CONTENT */
    .main-content {
      margin-left: 280px;
      min-height: 100vh;
      padding: 30px;
      transition: margin-left 0.3s ease;
    }

    /* HEADER */
    .header {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      padding: 32px 40px;
      border-radius: 24px;
      margin-bottom: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #0E4D2B, #1565C0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    /* DASHBOARD CARDS */
    .dashboard-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .dashboard-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      border-top: 4px solid #1565C0;
      transition: all 0.3s ease;
      text-align: center;
    }

    .dashboard-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }

    .dashboard-card h3 {
      color: #666;
      font-size: 16px;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .dashboard-card .number {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .high { color: #ff4757 !important; }
    .medium { color: #ffa502 !important; }
    .low { color: #2ed573 !important; }

    /* SEARCH & FILTER */
    .search-filter {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      padding: 24px 32px;
      border-radius: 20px;
      margin-bottom: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 300px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 18px 20px 18px 50px;
      border: 2px solid #e8f0fe;
      border-radius: 16px;
      font-size: 16px;
      background: white;
      transition: all 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: #1565C0;
      box-shadow: 0 0 0 4px rgba(21,101,192,0.1);
    }

    .search-box i {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 18px;
    }

    .filter-btns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 14px 24px;
      border: 2px solid #e8f0fe;
      background: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #1565C0;
      color: white;
      border-color: #1565C0;
      transform: translateY(-2px);
    }

    /* TABLE RESPONSIVE */
    .table-container {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .table-wrapper {
      overflow-x: auto;
      max-height: 70vh;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1400px;
    }

    th {
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      padding: 20px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
      color: #495057;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 3px solid #dee2e6;
    }

    td {
      padding: 20px 16px;
      border-bottom: 1px solid #e9ecef;
      vertical-align: top;
      font-size: 14px;
    }

    tr:hover {
      background: #f8f9ff;
    }

    /* FORM ELEMENTS */
    select, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.3s;
      background: white;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: #1565C0;
      box-shadow: 0 0 0 3px rgba(21,101,192,0.1);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      max-height: 200px;
    }

    /* BUTTONS */
    .action-btn {
      width: 100%;
      padding: 14px 16px;
      margin: 4px 0;
      border: none;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .btn-primary { background: linear-gradient(135deg, #1565C0, #0E4D2B); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(21,101,192,0.3); }
    
    .btn-success { background: linear-gradient(135deg, #2ed573, #1cb698); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(46,213,115,0.3); }
    
    .btn-warning { background: linear-gradient(135deg, #ffa502, #ff8f00); color: white; }
    .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,165,2,0.3); }
    
    .btn-danger { background: linear-gradient(135deg, #ff4757, #ff3742); color: white; }
    .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,71,87,0.3); }

    /* EXPORT BUTTON */
    .export-section {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      padding: 24px 32px;
      border-radius: 20px;
      margin-bottom: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .export-btn {
      background: linear-gradient(135deg, #ff6b6b, #ff5252);
      color: white;
      padding: 18px 40px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 25px rgba(255,107,107,0.3);
    }

    .export-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(255,107,107,0.4);
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 1024px) {
      .sidebar {
        transform: translateX(-100%);
      }
      
      .main-content {
        margin-left: 0;
      }
      
      .sidebar.mobile-open {
        transform: translateX(0);
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px 16px;
      }
      
      .header {
        padding: 24px 20px;
        flex-direction: column;
        text-align: center;
      }
      
      .header h1 {
        font-size: 24px;
      }
      
      .search-filter {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filter-btns {
        justify-content: center;
      }
    }

    /* LOADING */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      font-size: 18px;
      color: #666;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e9ecef;
      border-top: 3px solid #1565C0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-heartbeat" style="font-size: 48px; color: #fff;"></i>
      <h2>BIACARE</h2>
      <p>HR SYSTEM v2.0</p>
    </div>
    
    <ul class="sidebar-nav">
      <li><button class="active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</button></li>
      <li><button data-page="high-priority"><i class="fas fa-exclamation-triangle"></i> Prioritas Tinggi</button></li>
      <li><button id="exportBtn"><i class="fas fa-download"></i> Export Report</button></li>
      <li><button onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button></li>
    </ul>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <!-- HEADER -->
    <div class="header">
      <div>
        <h1><i class="fas fa-users-cog"></i> Admin Panel HRD</h1>
        <p>PT. Bio Inti Agrindo - Monitoring Keluhan Karyawan</p>
      </div>
      <div id="liveStats" style="font-size: 18px; font-weight: 600;">
        <span style="color: #ff4757;">●</span> 0 Aktif
      </div>
    </div>

    <!-- DASHBOARD CARDS -->
    <div class="dashboard-cards">
      <div class="dashboard-card">
        <h3><i class="fas fa-file-alt"></i> Total Laporan</h3>
        <div class="number" id="totalLaporan">0</div>
      </div>
      <div class="dashboard-card">
        <h3><i class="fas fa-check-circle"></i> Selesai</h3>
        <div class="number low" id="laporanSelesai">0</div>
      </div>
      <div class="dashboard-card">
        <h3><i class="fas fa-clock"></i> Pending</h3>
        <div class="number medium" id="approvalPending">0</div>
      </div>
      <div class="dashboard-card">
        <h3><i class="fas fa-exclamation-triangle"></i> Prioritas Tinggi</h3>
        <div class="number high" id="highPriority">0</div>
      </div>
    </div>

    <!-- SEARCH & FILTER
