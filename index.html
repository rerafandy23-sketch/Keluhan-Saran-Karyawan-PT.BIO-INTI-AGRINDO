<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCy9-XeYCtRIizGgReyiFmfEY6wj7kbKl4",
  authDomain: "hr-complaint-system-dc65e.firebaseapp.com",
  projectId: "hr-complaint-system-dc65e",
  storageBucket: "hr-complaint-system-dc65e.appspot.com",
  messagingSenderId: "687763805360",
  appId: "1:687763805360:web:b914603af7c1057ce69775"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadData() {
  const snapshot = await getDocs(collection(db, "complaints"));
  const table = document.getElementById("tableBody");

  table.innerHTML = ""; // 🔥 penting biar tidak double

  let total = 0;
  let open = 0;
  let closed = 0;
  let no = 1;

  snapshot.forEach(docSnap => {
    const d = docSnap.data();

    total++;

    // ✅ STATUS FIX
    const statusText = d.status || "Open";
    const statusLower = statusText.toLowerCase();

    if (statusLower === "closed") {
      closed++;
    } else {
      open++;
    }

    // ✅ RENDER TABLE (BERSIH)
    table.innerHTML += `
      <tr>
        <td>${no++}</td>
        <td>${d.nama || "-"}</td>
        <td>${d.departemen || "-"}</td>
        <td>${d.jenis || "-"}</td>
        <td style="color:${statusLower === "closed" ? "green" : "orange"}">
          ${statusText}
        </td>
        <td>
          <button class="btn-close" onclick="closeCase('${docSnap.id}')">
            Close
          </button>
        </td>
      </tr>
    `;
  });

  document.getElementById("total").innerText = total;
  document.getElementById("open").innerText = open;
  document.getElementById("closed").innerText = closed;
}

// ✅ CLOSE CASE REAL FIREBASE
window.closeCase = async function (id) {
  if (!confirm("Yakin ingin close case ini?")) return;

  try {
    await updateDoc(doc(db, "complaints", id), {
      status: "Closed"
    });

    alert("Case berhasil di-close");
    loadData(); // reload data tanpa refresh
  } catch (error) {
    console.error(error);
    alert("Gagal close case");
  }
};

// LOAD DATA
loadData();
</script>
